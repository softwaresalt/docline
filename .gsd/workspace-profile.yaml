schema_version: 1.1.0
generated_at: '2026-11-18T00:02:00Z'
workspace_path: <local-workspace-path>
languages:
  primary: python
  version: '3.12'
  secondary: []
frameworks:
  list:
  - fastapi
  - pydantic
  mcp_sdk: mcp-python
  mcp_transport: stdio
primary_stack_pack: mcp-server
stack_packs:
- cli-tool
