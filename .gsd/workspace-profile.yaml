  command: python -m build
  check_command: python -m py_compile src/docline/__init__.py
test:
  runner: pytest
  command: pytest
  directory: tests
lint:
  tool: ruff
  command: ruff check .
typecheck:
  tool: pyright
  command: pyright src/
format:
  tool: ruff
  command: ruff format .
  check_command: ruff format --check .
ci:
  platform: GitHub Actions
  pipeline_steps:
  - changes
  - lint
  - format
  - typecheck
  - test
  - build
  - topology-check
  - ci-gate
  quality_gates:
  - ruff check .
  - ruff format --check .
  - pyright src/
  - pytest
  required_check_name: ci gate
  linux_only: true
