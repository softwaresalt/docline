  ERROR_HANDLING_POLICY: All exceptions must be typed; use custom exception hierarchy
  ERROR_PATTERN: raise/except with typed exceptions
  EXAMPLE_SCOPE: core
  FILE_EXT: py
  FORMAT_CHECK_COMMAND: uv run ruff format --check .
  FORMAT_COMMAND: uv run ruff format --check .
  FORMAT_FIX_COMMAND: uv run ruff format .
