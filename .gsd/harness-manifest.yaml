variables_used:
  ADDITIONAL_COMMANDS: 'uv run pyright src/                   # Type check

    docline fetch                  # Run the I/O-bound document fetch phase

    docline process                # Run the compute-bound processing phase

    docline --manifest             # Output the JSON Schema tool definition'
  AGENTIC_CONFIG_GLOB: .github/**/*.md, .github/**/*.yml, .github/**/*.yaml, .vscode/**/*.json, .gsd/**/*.yaml
  ALT_DOC_REVIEW_FAMILY: claude-opus-4.8
  ALT_DOC_REVIEW_PROVIDER: anthropic
  ALT_REVIEW_FAMILY: claude-opus-4.8
  ALT_REVIEW_PROVIDER: anthropic
  ANTI_PATTERNS: '* Bare `except:` or exception swallowing that hides parse failures

    * Mutable default arguments and hidden module-level state

    * `subprocess` calls with `shell=True` for document or URL-derived values

    * Blocking I/O inside asyncio request handlers or MCP tool dispatch paths

    * Implicit current-working-directory assumptions for locating schemas, fixtures, or output roots

    * Writing partially normalized artifacts before validation completes'
  gsd_version: 1.6.0
  BACKLOG_DIRECTORY: .backlogit
  BACKLOG_TOOL_NAME: backlogit
  BUILD_CHECK_COMMAND: uv run python -m py_compile src/docline/__init__.py
  BUILD_COMMAND: uv run python -m build
  BUILD_TOOL: uv
  CI_GSD_INSTALL_COMMAND: "|\n          $ErrorActionPreference = 'Stop'\n          $version = '1.6.0'\n          $release\
    \ = \"https://github.com/softwaresalt/GSD/releases/download/v$version\"\n          $toolDir = Join-Path $PWD '.gsd'\n\
    \          New-Item -ItemType Directory -Path $toolDir -Force | Out-Null\n          $exeHash = 'df8a29d5a9f7f1306a9abe2ca1ae5e314e638ebfa0d9ac8a1ec4524cea27470e'\n\
    \          $bundleHash = 'b170652c9d83786cde8e988ef8d4c9cf47fb7039373383645b2a7ad7d053ebc1'\n          $assets = @(\n\
    \            @{ Name = 'gsd.exe'; Asset = 'gsd-windows-amd64.exe'; Hash = $exeHash },\n            @{ Name = \"gsd-assets-v$version.zip\"\
    ; Asset = 'gsd-assets.zip'; Hash = $bundleHash }\n          )\n          foreach ($asset in $assets) {\n            $path\
    \ = Join-Path $toolDir $asset.Name\n            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {\n          \
    \    Invoke-WebRequest -Uri \"$release/$($asset.Asset)\" -OutFile $path\n            }\n            if ((Get-FileHash\
    \ -LiteralPath $path -Algorithm SHA256).Hash -ne $asset.Hash) {\n              throw \"SHA-256 mismatch: $($asset.Name)\"\
    \n            }\n          }\n          $bundleName = \"gsd-assets-v$version.zip\"\n          $compatBundle = Join-Path\
    \ $toolDir 'gsd-assets.zip'\n          if (-not (Test-Path -LiteralPath $compatBundle -PathType Leaf)) {\n           \
    \ Copy-Item -LiteralPath (Join-Path $toolDir $bundleName) -Destination $compatBundle\n          }\n          if ((Get-FileHash\
    \ -LiteralPath $compatBundle -Algorithm SHA256).Hash -ne $bundleHash) {\n            throw 'SHA-256 mismatch: gsd-assets.zip'\n\
    \          }\n          $manifestPath = Join-Path $toolDir 'runtime-manifest.json'\n          if (-not (Test-Path -LiteralPath\
    \ $manifestPath -PathType Leaf)) {\n            $now = [DateTime]::UtcNow.ToString(\"yyyy-MM-ddTHH:mm:ss'Z'\")\n     \
    \       $manifest = @{\n              schema_version = '1.0.0'\n              last_op_id = \"ci-bootstrap-$version\"\n\
    \              active_version = $version\n              release_tag = \"v$version\"\n              executable_path = 'gsd.exe'\n\
    \              executable_sha256 = $exeHash\n              bundle_path = $bundleName\n              bundle_sha256 = $bundleHash\n\
    \              installed_bundles = @(@{\n                version = $version; path = $bundleName\n                sha256\
    \ = $bundleHash; installed_at_utc = $now\n              })\n              updated_at_utc = $now\n            }\n     \
    \       [IO.File]::WriteAllText(\n              $manifestPath,\n              ($manifest | ConvertTo-Json -Depth 5),\n\
    \              [Text.UTF8Encoding]::new($false)\n            )\n          } else {\n            $manifest = Get-Content\
    \ -LiteralPath $manifestPath -Raw | ConvertFrom-Json\n            if ($manifest.active_version -ne $version -or\n    \
    \            $manifest.executable_path -ne 'gsd.exe' -or\n                $manifest.executable_sha256 -ne $exeHash -or\n\
    \                $manifest.bundle_path -ne $bundleName -or\n                $manifest.bundle_sha256 -ne $bundleHash) {\n\
    \              throw 'Existing runtime-manifest.json does not match the pinned Windows runtime'\n            }\n     \
    \     }\n          $toolDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append\n          & \"$toolDir\\gsd.exe\"\
    \ version --no-update-check\n          if ($LASTEXITCODE -ne 0) { throw 'GSD version check failed' }"
  CI_DEFAULT_BRANCH: main
  CI_DOCS_ONLY_PATHS: "              - '!docs/**'\n              - '!.backlogit/**'\n              - '!.gsd/**'"
  CI_EXPENSIVE_JOB_NAME: quality gates
  CI_PLATFORM: GitHub Actions
  CI_REQUIRED_CHECK_NAME: ci gate
  CI_RUNNER_OS: ubuntu-latest
  CI_SETUP_STEPS: "      - name: Checkout\n        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3\n\
    \        with:\n          persist-credentials: false\n      - name: Install uv\n        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39\
    \  # v8.2.0\n        with:\n          enable-cache: true\n          cache-dependency-glob: \"uv.lock\"\n      - name:\
    \ Set up Python 3.12\n        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0\n        with:\n\
    \          python-version: \"3.12\"\n      - name: Sync dependencies\n        run: uv sync --locked --all-extras --dev"
  COMMIT_SCOPES: core, cli, mcp, fetch, process, schema, docs
