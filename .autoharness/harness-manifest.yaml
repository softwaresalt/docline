variables_used:
  ADDITIONAL_COMMANDS: 'pyright src/                   # Type check

    docline fetch                  # Run the I/O-bound document fetch phase

    docline process                # Run the compute-bound processing phase

    docline --manifest             # Output the JSON Schema tool definition'
  AGENTIC_CONFIG_GLOB: .github/**/*.md, .github/**/*.yml, .github/**/*.yaml, .vscode/**/*.json, .autoharness/**/*.yaml
  ALT_DOC_REVIEW_FAMILY: claude-opus-4.8
  ALT_DOC_REVIEW_PROVIDER: anthropic
  ALT_REVIEW_FAMILY: claude-opus-4.8
  ALT_REVIEW_PROVIDER: anthropic
  ANTI_PATTERNS: '* Bare `except:` or exception swallowing that hides parse failures

    * Mutable default arguments and hidden module-level state

    * `subprocess` calls with `shell=True` for document or URL-derived values

    * Blocking I/O inside asyncio request handlers or MCP tool dispatch paths

    * Implicit current-working-directory assumptions for locating schemas, fixtures, or output roots

    * Writing partially normalized artifacts before validation completes'
  AUTOHARNESS_VERSION: 1.5.0
  BACKLOG_DIRECTORY: .backlogit
  BACKLOG_TOOL_NAME: backlogit
  BUILD_CHECK_COMMAND: python -m py_compile src/docline/__init__.py
  BUILD_COMMAND: python -m build
  BUILD_TOOL: pip
  CI_AUTOHARNESS_INSTALL_COMMAND: pip install autoharness
  CI_DEFAULT_BRANCH: main
  CI_DOCS_ONLY_PATHS: "              - '!docs/**'\n              - '!.backlogit/**'\n              - '!.autoharness/**'"
  CI_EXPENSIVE_JOB_NAME: quality gates
  CI_PLATFORM: GitHub Actions
  CI_REQUIRED_CHECK_NAME: ci gate
  CI_RUNNER_OS: ubuntu-latest
  CI_SETUP_STEPS: "      - name: Checkout\n        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3\n        with:\n          persist-credentials: false\n      - name: Install uv\n        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0\n        with:\n          enable-cache: true\n          cache-dependency-glob: \"uv.lock\"\n      - name: Set up Python 3.12\n        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0\n        with:\n          python-version: \"3.12\"\n      - name: Sync dependencies\n        run: uv sync --locked --all-extras --dev"
  COMMIT_SCOPES: core, cli, mcp, fetch, process, schema, docs
  COPILOT_EXE_PATH: copilot
  DOCS_CLOSURE: docs/closure
  DOCS_COMPOUND: docs/compound
  DOCS_DECISIONS: docs/decisions
  DOCS_DESIGN_DOCS: docs/design-docs
  DOCS_MEMORY: docs/memory
  DOCS_PLANS: docs/plans
  DOCS_PRODUCT_SPECS: docs/product-specs
  DOCS_ROOT: docs
  DOCS_SECURITY: docs/security
  DOCUMENTATION_CONVENTIONS: Google-style docstrings on all public functions and classes
  DOC_COMMENT_STYLE: '"""Google-style docstrings"""'
  ERROR_HANDLING_CONVENTIONS: Raise specific Exception subclasses; never bare except
  ERROR_HANDLING_POLICY: All exceptions must be typed; use custom exception hierarchy
  ERROR_PATTERN: raise/except with typed exceptions
  EXAMPLE_SCOPE: core
  FILE_EXT: py
  FORMAT_CHECK_COMMAND: ruff format --check .
  FORMAT_COMMAND: ruff format --check .
  FORMAT_FIX_COMMAND: ruff format .
  FORMAT_TOOL: ruff
  HARNESS_ENFORCED_SUMMARY: '* Markdown formatting and markdownlint heading hierarchy (MD001/MD025/MD041, P-008)

    * Workflow policies P-001 through P-021 and constitutional principle sequencing

    * Test-first red-green gate mechanics (P-002, P-004) and the `pytest` suite run

    * Lint and format gates already enforced by `ruff check .` and `ruff format --check .`

    * Static typing already enforced by `pyright src/`

    * Merge-commit-only discipline (P-009, Principle XI) — squash and rebase are forbidden

    * Role-boundary enforcement (P-010) and single-worktree topology (P-016)

    * Backlog and shipment bookkeeping conventions (backlogit)

    * Template variable-completeness and cross-reference integrity checks'
  HARNESS_MANIFEST_PATH: .autoharness/harness-manifest.yaml
  INSTALL_PRESET: full
  LANGUAGE_FILE_GLOB: '**/*.py'
  LANGUAGE_VERSION: '3.12'
  LINT_COMMAND: ruff check .
  LINT_POLICY: ruff check fails on any warning; zero-tolerance for lint errors
  LINT_TOOL: ruff
  MAX_WAIT: '600'
  MCP_PROJECT_STRUCTURE: 'src/docline/mcp/       # MCP server entry point, tool registration, stdio transport

    src/docline/schema/    # Pydantic models shared by the CLI and MCP tool schemas

    src/docline/fetch/     # I/O-bound fetch phase invoked by both interfaces

    src/docline/process/   # Compute-bound normalization phase invoked by both interfaces

    tests/                 # pytest suite mirroring src/ structure'
  MCP_SDK: mcp
  MCP_TRANSPORT: stdio
  NAMING_CONVENTIONS: snake_case for functions/variables, PascalCase for classes, UPPER_CASE for constants
  POLL_INTERVAL: '30'
  PRIMARY_LANGUAGE: Python
  PRIMARY_LANGUAGE_LOWER: python
  PRIMARY_STACK_PACK: mcp-server
  PROJECT_NAME: docline
  PROJECT_STRUCTURE: 'src/docline/ — main package

    tests/ — pytest test suite

    docs/design-docs/ — architecture and design documents

    docs/product-specs/ — product requirements'
  QUALITY_GATE_1: ruff check .
  QUALITY_GATE_1_NAME: lint
  QUALITY_GATE_2: pyright src/
  QUALITY_GATE_2_NAME: typecheck
  QUALITY_GATE_3: pytest
  QUALITY_GATE_3_NAME: test
  QUALITY_GATE_4: ruff format --check .
  QUALITY_GATE_4_NAME: format
  REPOSITORY_OPERATING_MODEL: Single-repo Python CLI + MCP server with dual-interface parity requirement
  REPO_NAME: docline
  REPO_OWNER: softwaresalt
  SECURITY_CONFIG_RULES: Credential regexes, unsafe tool allow-lists, missing validation guardrails, exposed env defaults, and missing CI security gate references.
  SECURITY_OWASP_PATTERNS: Python OWASP heuristics for subprocess injection, path traversal, unsafe parsing, weak crypto, secret logging, SSRF, and untrusted deserialization.
  SECURITY_REVIEW_PATTERNS: src/docline/fetch/**, src/docline/mcp/**, src/docline/readers/**, src/docline/schema/**, src/docline/runtime/**, src/docline/_tools/**
  SECURITY_SCAN_PATTERNS: Python patterns for subprocess and shell interpolation, unsafe archive extraction and path traversal, SSRF-prone URL handling, unsafe YAML/XML/HTML parsing, secret logging, and auth gaps between the CLI and MCP stdio entry points
  SOURCE_DIR: src/
  SOURCE_GLOB: src/**/*.py
  TEST_COMMAND: pytest
  TEST_DIR: tests/
  TEST_STRUCTURE: Tests in tests/ directory mirroring src/ structure
  TEST_TOOL: pytest
  TYPECHECK_COMMAND: pyright src/
  TYPECHECK_TOOL: pyright
  UNIMPLEMENTED_MARKER: raise NotImplementedError("...")
  UNSAFE_POLICY: type hints required on all public interfaces
